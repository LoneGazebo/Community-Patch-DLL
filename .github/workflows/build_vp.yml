name: Build

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ master ]
    tags:
      - 'Release-*'  # Triggers on official releases (always builds)
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [ master ]
  workflow_dispatch:  # Manual trigger (always builds, skips path filter)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  get-version:
    name: Extract Version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for git describe
          filter: tree:0  # Commits and tags only: a full clone has taken over 5 minutes

      - name: Get Version
        id: version
        shell: bash
        run: |
          # Get version using git describe --long (matches update_commit_id.bat)
          if FULL_VERSION=$(git describe --tags --long 2>/dev/null); then
            # Extract version same way as minidump code (remove prefix before first '-')
            # "Release-5.1.3-0-g9fb5755" -> "5.1.3-0-g9fb5755"
            VERSION=$(echo "$FULL_VERSION" | sed 's/^[^-]*-//')
          else
            # No tag reachable (e.g. a fork without the release tags): the commit hash only, "abc123d"
            VERSION=$(git rev-parse --short HEAD)
            FULL_VERSION="No-Tag-$VERSION"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Full version: $FULL_VERSION"
          echo "Artifact version: $VERSION"

  detect-changes:
    if: github.event.pull_request.draft == false && !startsWith(github.ref, 'refs/tags/')
    name: Detect File Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dll-source: ${{ steps.filter.outputs.dll-source }}
      build-scripts: ${{ steps.filter.outputs.build-scripts }}
      workflow: ${{ steps.filter.outputs.workflow }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      lua: ${{ steps.filter.outputs.lua }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ''
          filters: |
            dll-source:
              - 'CvGameCoreDLL_Expansion2/**'
              - 'CvGameCoreDLLUtil/**'
              - 'CvGameDatabase/**'
              - 'CvLocalization/**'
              - 'CvWorldBuilderMap/**'
              - 'FirePlace/**'
              - 'ThirdPartyLibs/**'
              - '*.cpp'
              - '*.h'
            build-scripts:
              - 'build_vp_clang*.py'
              - 'update_commit_id.bat'
            workflow:
              - '.github/workflows/**'
            dependencies:
              - '*.sln'
              - '*.vcxproj'
            lua:
              - '**/*.lua'
              - '.luacheckrc'
              - '.github/scripts/luacheck_new_warnings.py'

      - name: Changes Summary
        run: |
          echo "### 🔍 File Changes Summary" >> $GITHUB_STEP_SUMMARY
          echo "- DLL Source: ${{ steps.filter.outputs.dll-source == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Scripts: ${{ steps.filter.outputs.build-scripts == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: ${{ steps.filter.outputs.workflow == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependencies: ${{ steps.filter.outputs.dependencies == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY

  lua-check:
    needs: [detect-changes]
    if: |
      always() &&
      (startsWith(github.ref, 'refs/tags/Release-') ||
       github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' &&
        (needs.detect-changes.outputs.lua == 'true' ||
         needs.detect-changes.outputs.workflow == 'true')))
    name: Lua check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2  # a pull request's merge commit and its base (HEAD^1)

      - name: Install Lua 5.1 and luacheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends lua5.1 lua-check > /dev/null
          luac5.1 -v
          luacheck --version | head -n 1

      # The game runs Lua 5.1, and a file that does not parse does not load at all: its screen
      # or feature stops working, with only a line in Lua.log. luac5.1 is the 5.1 parser itself
      # (luacheck also accepts 5.2/5.3 syntax such as goto and //).
      # UI_bc1 is EUI as bc1 ships it and is not edited here, so it is reported, never failed.
      # LuaCATS holds editor type stubs, not game code.
      - name: Check Lua 5.1 syntax
        run: |
          check() {  # $1 = error or warning, $2 = note; NUL-separated paths on stdin; sets $n, $bad
            n=0 bad=0
            local f out loc msg
            while IFS= read -r -d '' f; do
              n=$((n + 1))
              out=$(luac5.1 -p "$f" 2>&1) && continue
              bad=$((bad + 1))
              loc=${out#"luac5.1: $f:"}; loc=${loc%%:*}; msg=${out#"luac5.1: $f:$loc: "}
              case $loc in ''|*[!0-9]*) loc=1; msg=$out ;; esac
              f2=${f//%/%25}; f2=${f2//:/%3A}; f2=${f2//,/%2C}
              echo "::$1 file=$f2,line=$loc,title=Lua 5.1 syntax::$msg$2"
              echo "- \`$f:$loc\`: $msg$2" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "$n files checked, $bad do not parse"
          }
          printf '### Lua 5.1 syntax\n\n' >> "$GITHUB_STEP_SUMMARY"
          echo "UI_bc1 (reported only):"
          check warning " (UI_bc1 is not edited here; fix a copy in (3a) VP - EUI Compatibility Files)" \
            < <(git ls-files -z -- 'UI_bc1/*.lua')
          echo "Everything else:"
          check error < <(git ls-files -z -- '*.lua' ':(exclude)LuaCATS/' ':(exclude)UI_bc1/')
          if [ "$bad" -ne 0 ]; then
            printf '\n%s Lua file(s) do not parse as Lua 5.1, so the game cannot load them.\n' "$bad" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          printf '\nAll %s checked files outside UI_bc1 parse.\n' "$n" >> "$GITHUB_STEP_SUMMARY"

      # Report only, never fails the job: luacheck warnings that the pull request adds to the
      # Lua files it changes. The repository as a whole has thousands of older warnings.
      - name: New luacheck warnings (report only)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: python3 .github/scripts/luacheck_new_warnings.py HEAD^1

  build-clang:
    name: Clang ${{ matrix.config }}
    needs: [get-version, detect-changes]
    if: |
      always() && needs.get-version.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/Release-') ||
       github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' && 
        (needs.detect-changes.outputs.dll-source == 'true' || 
         needs.detect-changes.outputs.build-scripts == 'true' || 
         needs.detect-changes.outputs.workflow == 'true' || 
         needs.detect-changes.outputs.dependencies == 'true')))
    runs-on: windows-2022
    timeout-minutes: 120
    # Debug and Release build in parallel jobs: the Release link (LTCG) is the long step, and Debug no longer waits in front of it
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags for update_commit_id.bat (git describe), else the DLL says "No-Tag <hash>"
          filter: tree:0  # commits and tags only; checkout fetches the trees it needs

      - name: Set up VC9 SP1 (v90)
        id: vc9
        uses: JohnsterID/vc9-toolset@48b240fe51f34b94ee1b48273967f67ad975030a # v1.0.0

      # Pinned, so a runner image update can't change the compiler under us.
      - name: Install LLVM 20.1.8
        run: |
          choco install llvm --version=20.1.8 --allow-downgrade -y --no-progress
          $version = clang-cl --version | Out-String
          echo $version
          if ($version -notmatch 'clang version 20\.1\.8') { echo "::error::Expected clang 20.1.8"; exit 1 }

      - name: Run ${{ matrix.config }} build
        run: python build_vp_clang_sdk.py --config ${{ matrix.config == 'Debug' && 'debug' || 'release' }}

      - name: Display ${{ matrix.config }} build log
        if: always() && hashFiles(format('clang-output/{0}/build.log', matrix.config)) != ''
        run: cat clang-output/${{ matrix.config }}/build.log

      # Civ 5 only ships the VC9 runtime. A DLL linked against a newer MSVC runtime builds
      # fine and then fails to load in the game. The list is what the gamecore imports today.
      - name: Check DLL imports
        run: |
          $allowed = 'ADVAPI32.dll', 'CvGameDatabaseWin32Final Release.dll', 'CvLocalizationWin32Final Release.dll',
                     'dbghelp.dll', 'KERNEL32.dll', 'lua51_Win32.dll', 'MSVCP90.dll', 'MSVCR90.dll',
                     'ole32.dll', 'PSAPI.DLL', 'USER32.dll', 'WINMM.dll'
          $failed = $false
          foreach ($dll in 'clang-output\${{ matrix.config }}\CvGameCore_Expansion2.dll') {
            $imports = llvm-readobj --coff-imports $dll | Select-String '^\s*Name: (.+)$' | ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() }
            echo "${dll}: $($imports -join ', ')"
            foreach ($name in $imports) {
              if ($allowed -notcontains $name) { echo "::error::$dll imports $name"; $failed = $true }
            }
          }
          if ($failed) { exit 1 }

      - name: Analyze Clang build warnings and errors
        if: always()
        uses: JohnsterID/vc9-toolset/analyze-build-log@48b240fe51f34b94ee1b48273967f67ad975030a # v1.0.0
        with:
          logs: |
            Clang ${{ matrix.config }}=clang-output/${{ matrix.config }}/build.log

      - name: Create ${{ matrix.config }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: VP_Clang_${{ matrix.config }}_${{ needs.get-version.outputs.version }}
          path: 'clang-output\${{ matrix.config }}'
          if-no-files-found: error

  build-msvc:
    name: MSVC ${{ matrix.config }}
    needs: [get-version, detect-changes]
    if: |
      always() && needs.get-version.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/Release-') ||
       github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' && 
        (needs.detect-changes.outputs.dll-source == 'true' || 
         needs.detect-changes.outputs.build-scripts == 'true' || 
         needs.detect-changes.outputs.workflow == 'true' || 
         needs.detect-changes.outputs.dependencies == 'true')))
    runs-on: windows-2022
    timeout-minutes: 120
    # Debug and Release build in parallel jobs: the Release link (LTCG) is the long step, and Debug no longer waits in front of it
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags for update_commit_id.bat (git describe), else the DLL says "No-Tag <hash>"
          filter: tree:0  # commits and tags only; checkout fetches the trees it needs

      - name: Set up VC9 SP1 (v90)
        id: vc9
        uses: JohnsterID/vc9-toolset@48b240fe51f34b94ee1b48273967f67ad975030a # v1.0.0

      # The action's v90 toolset files set the VC9 and SDK 7.0 paths, so no vcvars32.bat
      - name: Build MSVC ${{ matrix.config }}
        run: '& "${{ steps.vc9.outputs.msbuild }}" VoxPopuli_vs2013.sln /p:Configuration=${{ matrix.config }} /p:Platform=Win32 /v:normal "/flp:logfile=msvc_${{ matrix.config }}_msbuild.log;verbosity=normal"'

      - name: Analyze build warnings and errors
        if: always()
        uses: JohnsterID/vc9-toolset/analyze-build-log@48b240fe51f34b94ee1b48273967f67ad975030a # v1.0.0
        with:
          logs: |
            MSVC ${{ matrix.config }}=msvc_${{ matrix.config }}_msbuild.log

      - name: Create MSVC ${{ matrix.config }} artifact
        uses: actions/upload-artifact@v7
        with:
          name: VP_MSVC_${{ matrix.config }}_${{ needs.get-version.outputs.version }}
          path: 'BuildOutput/${{ matrix.config }}'
          if-no-files-found: error


