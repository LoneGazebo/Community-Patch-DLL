name: Build

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [ master ]
    tags:
      - 'Release-*'  # Triggers on official releases (always builds)
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [ master ]
  workflow_dispatch:  # Manual trigger (always builds, skips path filter)

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  get-version:
    name: Extract Version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for git describe
          filter: tree:0  # Commits and tags only: a full clone has taken over 5 minutes

      - name: Get Version
        id: version
        shell: bash
        run: |
          # Get version using git describe --long (matches update_commit_id.bat)
          if FULL_VERSION=$(git describe --tags --long 2>/dev/null); then
            # Extract version same way as minidump code (remove prefix before first '-')
            # "Release-5.1.3-0-g9fb5755" -> "5.1.3-0-g9fb5755"
            VERSION=$(echo "$FULL_VERSION" | sed 's/^[^-]*-//')
          else
            # No tag reachable (e.g. a fork without the release tags): the commit hash only, "abc123d"
            VERSION=$(git rev-parse --short HEAD)
            FULL_VERSION="No-Tag-$VERSION"
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Full version: $FULL_VERSION"
          echo "Artifact version: $VERSION"

  detect-changes:
    if: github.event.pull_request.draft == false && !startsWith(github.ref, 'refs/tags/')
    name: Detect File Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dll-source: ${{ steps.filter.outputs.dll-source }}
      build-scripts: ${{ steps.filter.outputs.build-scripts }}
      workflow: ${{ steps.filter.outputs.workflow }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          token: ''
          filters: |
            dll-source:
              - 'CvGameCoreDLL_Expansion2/**'
              - 'CvGameCoreDLLUtil/**'
              - 'CvGameDatabase/**'
              - 'CvLocalization/**'
              - 'CvWorldBuilderMap/**'
              - 'FirePlace/**'
              - 'ThirdPartyLibs/**'
              - '*.cpp'
              - '*.h'
            build-scripts:
              - 'build_vp_clang*.py'
              - 'update_commit_id.bat'
            workflow:
              - '.github/workflows/**'
            dependencies:
              - '*.sln'
              - '*.vcxproj'

      - name: Changes Summary
        run: |
          echo "### 🔍 File Changes Summary" >> $GITHUB_STEP_SUMMARY
          echo "- DLL Source: ${{ steps.filter.outputs.dll-source == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Scripts: ${{ steps.filter.outputs.build-scripts == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: ${{ steps.filter.outputs.workflow == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependencies: ${{ steps.filter.outputs.dependencies == 'true' && '✅' || '❌' }}" >> $GITHUB_STEP_SUMMARY

  build-clang:
    needs: [get-version, detect-changes]
    if: |
      always() && needs.get-version.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/Release-') ||
       github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' && 
        (needs.detect-changes.outputs.dll-source == 'true' || 
         needs.detect-changes.outputs.build-scripts == 'true' || 
         needs.detect-changes.outputs.workflow == 'true' || 
         needs.detect-changes.outputs.dependencies == 'true')))
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags for update_commit_id.bat (git describe), else the DLL says "No-Tag <hash>"
          filter: tree:0  # commits and tags only; checkout fetches the trees it needs

      - name: Set up VC9 SP1 (v90)
        id: vc9
        uses: JohnsterID/vc9-toolset@48b240fe51f34b94ee1b48273967f67ad975030a # v1.0.0

      - name: Clang version check
        run: clang --version

      - name: Run debug build
        run: python build_vp_clang_sdk.py --config debug

      - name: Display debug build log
        if: always() && hashFiles('clang-output/Debug/build.log') != ''
        run: cat clang-output/Debug/build.log

      - name: Run release build
        run: python build_vp_clang_sdk.py --config release

      - name: Display release build log
        if: always() && hashFiles('clang-output/Release/build.log') != ''
        run: cat clang-output/Release/build.log

      - name: Analyze Clang build warnings and errors
        if: always()
        uses: JohnsterID/vc9-toolset/analyze-build-log@48b240fe51f34b94ee1b48273967f67ad975030a # v1.0.0
        with:
          logs: |
            Clang Debug=clang-output/Debug/build.log
            Clang Release=clang-output/Release/build.log

      - name: Create debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: VP_Clang_Debug_${{ needs.get-version.outputs.version }}
          path: 'clang-output\Debug'
          if-no-files-found: error

      - name: Create release artifact
        uses: actions/upload-artifact@v7
        with:
          name: VP_Clang_Release_${{ needs.get-version.outputs.version }}
          path: 'clang-output\Release'
          if-no-files-found: error

  build-msvc:
    needs: [get-version, detect-changes]
    if: |
      always() && needs.get-version.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/Release-') ||
       github.event_name == 'workflow_dispatch' ||
       (needs.detect-changes.result == 'success' && 
        (needs.detect-changes.outputs.dll-source == 'true' || 
         needs.detect-changes.outputs.build-scripts == 'true' || 
         needs.detect-changes.outputs.workflow == 'true' || 
         needs.detect-changes.outputs.dependencies == 'true')))
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tags for update_commit_id.bat (git describe), else the DLL says "No-Tag <hash>"
          filter: tree:0  # commits and tags only; checkout fetches the trees it needs

      - name: Set up VC9 SP1 (v90)
        id: vc9
        uses: JohnsterID/vc9-toolset@48b240fe51f34b94ee1b48273967f67ad975030a # v1.0.0

      # The action's v90 toolset files set the VC9 and SDK 7.0 paths, so no vcvars32.bat
      - name: Build msvc debug
        run: '& "${{ steps.vc9.outputs.msbuild }}" VoxPopuli_vs2013.sln /p:Configuration=Debug /p:Platform=Win32 /v:normal "/flp:logfile=msvc_debug_msbuild.log;verbosity=normal"'

      - name: Build msvc release
        run: '& "${{ steps.vc9.outputs.msbuild }}" VoxPopuli_vs2013.sln /p:Configuration=Release /p:Platform=Win32 /v:normal "/flp:logfile=msvc_release_msbuild.log;verbosity=normal"'

      - name: Analyze build warnings and errors
        if: always()
        uses: JohnsterID/vc9-toolset/analyze-build-log@48b240fe51f34b94ee1b48273967f67ad975030a # v1.0.0
        with:
          logs: |
            MSVC Debug=msvc_debug_msbuild.log
            MSVC Release=msvc_release_msbuild.log

      - name: Create msvc debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: VP_MSVC_Debug_${{ needs.get-version.outputs.version }}
          path: 'BuildOutput/Debug'
          if-no-files-found: error

      - name: Create msvc release artifact
        uses: actions/upload-artifact@v7
        with:
          name: VP_MSVC_Release_${{ needs.get-version.outputs.version }}
          path: 'BuildOutput/Release'
          if-no-files-found: error


